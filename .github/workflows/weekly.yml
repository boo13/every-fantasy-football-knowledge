name: Weekly public football context
on:
  schedule:
    - cron: '17 13 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weekly-public-context
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/collect.py --skip-news
      - run: python3 scripts/validate.py --fresh
      - name: Publish only public collection outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/snapshots context/CURRENT.md context/weekly
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'data: refresh weekly public football context'
          git pull --rebase origin main
          python3 scripts/validate.py --fresh
          git push origin HEAD:main
      - name: Surface degraded source health
        run: python3 scripts/validate.py --fresh --healthy
